name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # 1) Run the test suite against every supported Python version.
  tests:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run tests
        run: |
          uv run pytest -v

  # 2) Lint and formatting checks with ruff.
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Ruff lint
        run: |
          uv run ruff check .

      - name: Ruff format check
        run: |
          uv run ruff format --check .
