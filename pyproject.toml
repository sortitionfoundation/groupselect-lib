[project]
name = "groupselect"
version = "0.1.0"
description = "GroupSelect library."
authors = [
    { name = "Philipp C. Verpoort", email = "pcv@sortitionfoundation.org" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.4",
    "pytest>=9.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E501"]
